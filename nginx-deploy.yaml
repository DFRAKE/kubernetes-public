apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: nginx-app
          image: 933090817123.dkr.ecr.us-east-1.amazonaws.com/ecr-nginx:v3.0
          ports:
            - containerPort: 80
